<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プライバシーポリシー一覧</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif; line-height: 1.8; color: #333; background: #fafafa; padding: 24px 16px; }
  .container { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  h1 { font-size: 22px; margin-bottom: 8px; color: #1a1a1a; }
  .subtitle { font-size: 14px; color: #888; margin-bottom: 24px; }
  .app-list { list-style: none; padding: 0; }
  .app-list li { margin-bottom: 12px; }
  .app-list a { display: block; padding: 16px; background: #f7f7f7; border-radius: 8px; text-decoration: none; color: #333; transition: background 0.2s; }
  .app-list a:hover { background: #eef; }
  .app-list .name { font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .app-list .desc { font-size: 13px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
<h1>プライバシーポリシー一覧</h1>
<p class="subtitle">開発者: 遠山和夫</p>
<ul class="app-list">
  <li>
    <a href="kanjiapp/">
      <div class="name">漢字小学校</div>
      <div class="desc">小学1〜6年生向け 漢字練習アプリ</div>
    </a>
  </li>
  <li>
    <a href="kanjichuapp/">
      <div class="name">漢字中学校（中学漢字練習帳）</div>
      <div class="desc">中学生向け 漢字練習アプリ（28週カリキュラム）</div>
    </a>
  </li>
  <li>
    <a href="shioyomi/">
      <div class="name">潮よみ</div>
      <div class="desc">福島県沿岸の釣り人向け 潮汐情報アプリ</div>
    </a>
  </li>
  <li>
    <a href="gomidashsystem/">
      <div class="name">富士宮市ごみ出し検索システム</div>
      <div class="desc">ごみの分別方法・収集日検索アプリ</div>
    </a>
  </li>
  <li>
    <a href="sumburst/">
      <div class="name">Sum Burst: Daily Number Puzzle</div>
      <div class="desc">数字をなぞって消す 英語の脳トレパズル</div>
    </a>
  </li>
  <li>
    <a href="myphotoslidepuzzle/">
      <div class="name">マイフォト スライドパズル</div>
      <div class="desc">写真を使ったスライドパズルゲーム</div>
    </a>
  </li>
</ul>
</div>
</body>
</html>
